services:
  - type: web
    name: nexusevent-backend-gateway
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: npm run start:all
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
